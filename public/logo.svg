<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" fill="none">
  <!-- 1. Academic Graduation Cap (Solid Academic Blue #185d89) -->
  <g id="graduation-cap">
    <!-- Skullcap Base with Upward Arch -->
    <path 
      d="M 172,125 L 172,192 C 172,192 208,162 250,162 C 292,162 328,192 328,192 L 328,125 Z" 
      fill="#185d89" 
    />
    <!-- Diamond Mortarboard Top -->
    <polygon 
      points="250,36 405,112 250,152 95,112" 
      fill="#185d89" 
    />
    <!-- Cap Button (White Circle) -->
    <circle cx="114" cy="95" r="4.5" fill="#ffffff" />
    <!-- Tassel String -->
    <line x1="114" y1="99" x2="114" y2="170" stroke="#185d89" stroke-width="3.5" stroke-linecap="round" />
    <!-- Golden Yellow Tassel Brush (#fab324) -->
    <path 
      d="M 114,170 C 108,170 104,175 104,181 C 104,190 108,196 107,202 C 111,199 117,195 118,189 C 120,183 119,170 114,170 Z" 
      fill="#fab324" 
    />
  </g>

  <!-- 2. Golden Yellow Radiating Rays (#fab324) -->
  <g id="light-rays" stroke="#fab324" stroke-linecap="round">
    <!-- Left Rays -->
    <line x1="114" y1="188" x2="36" y2="156" stroke-width="6" />
    <line x1="98" y1="275" x2="16" y2="275" stroke-width="6.5" />
    <line x1="114" y1="362" x2="36" y2="394" stroke-width="6" />

    <!-- Right Rays -->
    <line x1="386" y1="188" x2="464" y2="156" stroke-width="6" />
    <line x1="402" y1="275" x2="484" y2="275" stroke-width="6.5" />
    <line x1="386" y1="362" x2="464" y2="394" stroke-width="6" />
  </g>

  <!-- 3. Stylized 'N' Bulb Filament (Warm Orange #eb6226) -->
  <g id="bulb-filament">
    <path 
      d="M 186,340 C 160,300 160,254 186,228 C 196,218 208,224 220,238 L 320,342 C 328,350 338,346 342,334 C 354,295 352,250 330,228" 
      stroke="#eb6226" 
      stroke-width="26" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
      fill="none" 
    />
  </g>

  <!-- 4. Bulb Base & Socket (قعر المصباح - نسب متناسقة ومطابقة تامة للصورة) -->
  <g id="bulb-base" stroke-linecap="round" stroke-linejoin="round">
    <!-- Neck stroke connected to top thread bar -->
    <path 
      d="M 196,370 L 218,390 L 218,423 L 282,423" 
      stroke="#eb6226" 
      stroke-width="22" 
      fill="none" 
    />
    <!-- 2 Lower Horizontal Orange Thread Bars -->
    <line x1="222" y1="444" x2="278" y2="444" stroke="#eb6226" stroke-width="20" />
    <line x1="228" y1="465" x2="272" y2="465" stroke="#eb6226" stroke-width="20" />
    <!-- Bottom Blue Contact Terminal -->
    <line x1="236" y1="484" x2="264" y2="484" stroke="#185d89" stroke-width="15" />
  </g>
</svg>
